# The whole app: Postgres, the API, the web and the cron jobs. Settings in .env (from deploy/env.example).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ffl
      POSTGRES_DB: ffl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${FFL_PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ffl", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/jonulak/ffl-api:${FFL_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      FFL_DB_URL: postgresql+psycopg://ffl:${POSTGRES_PASSWORD}@db:5432/ffl
      FFL_DATA_DIR: /var/lib/ffl/data
    volumes:
      - data:/var/lib/ffl/data
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ghcr.io/jonulak/ffl-web:${FFL_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      FFL_API_URL: http://api:8300
    ports:
      - "${FFL_PORT:-3300}:3000"
    depends_on:
      - api

  jobs:
    image: ghcr.io/jonulak/ffl-api:${FFL_VERSION:-latest}
    restart: unless-stopped
    command: ["crond", "-f", "-L", "/dev/stdout"]  # Debian's busybox has no -d
    env_file: .env
    environment:
      FFL_DB_URL: postgresql+psycopg://ffl:${POSTGRES_PASSWORD}@db:5432/ffl
      FFL_DATA_DIR: /var/lib/ffl/data
    volumes:
      - data:/var/lib/ffl/data
      - backups:/backups
    depends_on:
      - api

volumes:
  pgdata:
  data:
  backups:
