# The whole app: Postgres, the API, the agent runner, the web and the cron jobs. Secrets and the port in .env (from
# deploy/env.example); everything else is set in the app (the setup wizard, Settings › App) and kept in the database.
services:
  db:
    image: pgvector/pgvector:pg16   # postgres:16 with pgvector (news search); same data directory
    restart: unless-stopped
    environment:
      POSTGRES_USER: ffl
      POSTGRES_DB: ffl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ffl", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/jonulak/ffl-api:${FFL_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      FFL_DB_URL: postgresql+psycopg://ffl:${POSTGRES_PASSWORD}@db:5432/ffl
      FFL_DATA_DIR: /var/lib/ffl/data
      FFL_RUNNER_URL: http://runner:8310
    volumes:
      - data:/var/lib/ffl/data
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
      runner:
        condition: service_started

  # `claude -p` for outlooks and news (ffl/harness.py). No published port: only the api reaches it, with FFL_JOB_TOKEN.
  runner:
    image: ghcr.io/jonulak/ffl-runner:${FFL_VERSION:-latest}
    restart: unless-stopped
    environment:  # the shared secret alone, not .env: the runner needs no key ring or database (the api sends the token)
      FFL_JOB_TOKEN: ${FFL_JOB_TOKEN}

  web:
    image: ghcr.io/jonulak/ffl-web:${FFL_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      FFL_API_URL: http://api:8300
    ports:
      - "${FFL_PORT:-3300}:3000"
    depends_on:
      - api

  jobs:
    image: ghcr.io/jonulak/ffl-api:${FFL_VERSION:-latest}
    restart: unless-stopped
    command: ["crond", "-f", "-L", "/dev/stdout"]  # Debian's busybox has no -d
    env_file: .env
    environment:
      FFL_DB_URL: postgresql+psycopg://ffl:${POSTGRES_PASSWORD}@db:5432/ffl
      FFL_DATA_DIR: /var/lib/ffl/data
    volumes:
      - data:/var/lib/ffl/data
      - backups:/backups
    depends_on:
      - api

volumes:
  pgdata:
  data:
  backups:
