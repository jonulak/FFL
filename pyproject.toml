[project]
name = "ffl"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "beautifulsoup4>=4.15.0",
    "cryptography>=50",
    "espn-api>=0.46.0",
    "fastapi>=0.141.1",
    "lxml>=6.1.3",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "pywebpush>=2.5.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.4",
    "tabulate>=0.10.0",
    "uvicorn>=0.52.4",
    "websockets>=17.1",
    "youtube-transcript-api>=1.2.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.62.0",  # the Mac's draft tools only (browser, draft_pick, practice): not in the image
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "real_auth: run the API's real sign-in middleware instead of conftest's signed-in TEST_USER",
]
