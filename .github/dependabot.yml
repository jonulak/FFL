# The Dockerfiles' bases are pinned by digest (so an upgrade pulls only changed layers); this bumps them, monthly, in
# one PR per directory, so a base rebuild and its full re-pull happen when we choose.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      bases:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /web
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      bases:
        patterns: ["*"]
